[tool.poetry]
name = "workout-agent"
version = "0.1.0"
description = "Multi-agent workout planning API powered by LangGraph and Ollama"
authors = ["Workout Agent Team <team@workout-agent.local>"]
readme = "README.md"
packages = [{ include = "workout_agent" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
langgraph = "^0.2.70"
motor = "^3.6.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.2"
httpx = "^0.28.0"
typing-extensions = "^4.12.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"
mypy = "^1.11.2"
httpx = "^0.28.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
